[project]
name = "memisalluneed"
version = "0.1.0"
description = "A Memory-Centric Agent CLI memory substrate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
mem = "memisalluneed.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memisalluneed*"]

[tool.setuptools.package-data]
memisalluneed = ["ui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "real_model: tests that call configured real chat and formation models",
]
